<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一起画画 · 极光艺术馆</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../styles.css?v=nav-order-1">
  <link rel="stylesheet" href="../../directory-batches.css?v=phase-2-2">
  <link rel="stylesheet" href="../../aurora.css?v=draw-history-1">
  <link rel="stylesheet" href="../../huddle.css?v=1-1">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a class="brand-logo-trigger identity-image-trigger" href="../../南极大学校徽2.png" data-lightbox="identity" data-lightbox-alt="the University of Antarctica 标准校标" aria-label="查看 the University of Antarctica 标准校标">
        <img src="../../南极大学校徽2.png" alt="the University of Antarctica 标准校标">
      </a>
      <div class="brand-name" aria-label="南极大学"><strong>南极大学</strong></div>
    </div>
    <nav aria-label="机构导航与主导航">
      <a class="directory-nav-link" href="../../">学生名录</a>
      <a class="directory-nav-link" href="../../campus/">校园活动</a>
      <a class="directory-nav-link" href="../../alumni/">校友风采</a>
      <a class="directory-nav-link" href="../" aria-current="location">极光艺术馆</a>
      <span class="nav-break" aria-hidden="true"></span>
      <a class="institutional-node" href="../../阿德利教授小红书.jpg" data-lightbox="identity" data-lightbox-alt="阿德利教授, Ph.D. 小红书账户卡" aria-label="查看阿德利教授, Ph.D. 身份卡">
        <span class="identity-portrait"><img src="../../阿德利教授.png" alt="阿德利教授, Ph.D. 头像"></span>
        <span class="identity-copy"><strong>阿德利教授, Ph.D.</strong><small>小红书</small></span>
      </a>
      <a class="institutional-node" href="../../一袋企鹅二维码.jpg" data-lightbox="identity" data-lightbox-alt="一袋企鹅微信公众号二维码" aria-label="查看一袋企鹅微信公众号二维码">
        <span class="identity-qr"><img src="../../一袋企鹅二维码.jpg" alt="一袋企鹅微信公众号二维码"></span>
        <span class="identity-copy"><strong>一袋企鹅</strong><small>微信公众号</small></span>
      </a>
    </nav>
  </header>

  <main>
    <section class="aurora-directory artist-directory-page draw-page" aria-labelledby="draw-page-title">
      <div class="artist-directory-heading">
        <div><p class="eyebrow">COLLECTIVE ART</p><h1 id="draw-page-title">一起画画</h1></div>
        <a href="../">← 返回极光艺术馆</a>
      </div>
      <div class="draw-intro-row"><p class="draw-intro">选一个角色，画出你的版本。完成后可以下载 PNG 图片。</p><a href="#history">查看历史画作 ↓</a></div>
      <div class="draw-projects" role="group" aria-label="选择一起画画的角色">
        <button class="draw-project is-selected" type="button" data-project="professor" aria-pressed="true"><img src="../assets/works/thumb/w057.webp" alt=""><span>画画教授</span></button>
        <button class="draw-project" type="button" data-project="yuyuan" aria-pressed="false"><img src="../assets/works/thumb/w065.webp" alt=""><span>画画芋圆</span></button>
        <button class="draw-project" type="button" data-project="penguin" aria-pressed="false"><img src="../assets/works/thumb/w073.webp" alt=""><span>画画企鹅</span></button>
      </div>

      <section class="draw-workspace" aria-labelledby="draw-workspace-title">
        <div class="draw-workspace-heading">
          <div><p class="eyebrow">DRAW TOGETHER</p><h2 id="draw-workspace-title">画画教授</h2></div>
          <p>画好后记得下载保存。</p>
        </div>
        <div class="draw-template-options" id="draw-template-options" role="group" aria-label="选择底图">
          <button type="button" data-template="professor-1" aria-pressed="true">画画阿德利教授</button>
          <button type="button" data-template="professor-2" aria-pressed="false">画画帝加索</button>
        </div>
        <div class="draw-layout">
          <div class="draw-tools" aria-label="绘画工具">
            <div class="draw-tool-row" role="group" aria-label="绘画方式">
              <button type="button" id="draw-brush" class="is-active" aria-pressed="true">画笔</button>
              <button type="button" id="draw-eraser" aria-pressed="false">橡皮</button>
            </div>
            <fieldset class="draw-colors"><legend>颜色</legend>
              <button type="button" class="draw-color is-selected" data-color="#263f59" aria-label="深蓝色" aria-pressed="true" style="--swatch:#263f59"></button>
              <button type="button" class="draw-color" data-color="#f16d67" aria-label="珊瑚红" aria-pressed="false" style="--swatch:#f16d67"></button>
              <button type="button" class="draw-color" data-color="#f6b94d" aria-label="金黄色" aria-pressed="false" style="--swatch:#f6b94d"></button>
              <button type="button" class="draw-color" data-color="#80a99a" aria-label="松绿色" aria-pressed="false" style="--swatch:#80a99a"></button>
              <button type="button" class="draw-color" data-color="#90a7d8" aria-label="浅蓝色" aria-pressed="false" style="--swatch:#90a7d8"></button>
              <button type="button" class="draw-color" data-color="#c7a4bc" aria-label="浅紫色" aria-pressed="false" style="--swatch:#c7a4bc"></button>
              <label class="draw-custom-color">自选 <input type="color" id="draw-custom-color" value="#263f59" aria-label="自选画笔颜色"></label>
            </fieldset>
            <label class="draw-size-label" for="draw-size">笔触粗细 <output id="draw-size-value">12</output></label>
            <input type="range" id="draw-size" min="3" max="48" value="12">
            <div class="draw-history">
              <button type="button" id="draw-undo" disabled>撤销</button>
              <button type="button" id="draw-clear" disabled>清空画笔</button>
            </div>
            <button type="button" id="draw-download" class="draw-download" disabled>下载我的画作</button>
            <p class="draw-status" id="draw-status" role="status" aria-live="polite"></p>
          </div>
          <div class="draw-board-wrap">
            <div class="draw-board" id="draw-board" aria-busy="true">
              <canvas id="draw-canvas" tabindex="0" aria-label="绘画画布，可用鼠标或手指绘画"></canvas>
              <img id="draw-base" alt="画画教授底图" draggable="false">
            </div>
          </div>
        </div>
      </section>
    </section>
    <section class="aurora-directory draw-past-works" id="history" aria-labelledby="draw-past-title">
      <div class="aurora-section-heading">
        <div><p class="eyebrow">PAST DRAWINGS</p><h2 id="draw-past-title">历史画作</h2></div>
      </div>
      <div id="collectives-grid" class="exhibition-album-grid" aria-live="polite"></div>
    </section>
  </main>

  <section class="institutional-closing" aria-label="南极大学校训">
    <img class="motto-image" src="../../南极大学校训.png" alt="From the Ice, For the Earth · 南极大学校训">
  </section>
  <footer>南极大学 · The University of Antarctica <span>Aurora Art Gallery archive</span></footer>

  <div class="identity-lightbox" id="identity-lightbox" hidden role="dialog" aria-modal="true" aria-labelledby="identity-lightbox-title">
    <div class="identity-lightbox-backdrop" data-close-lightbox></div>
    <div class="identity-lightbox-dialog">
      <h2 id="identity-lightbox-title" class="visually-hidden">the University of Antarctica identity asset</h2>
      <button class="identity-lightbox-close" id="identity-lightbox-close" type="button" aria-label="关闭身份资产预览">×</button>
      <img id="identity-lightbox-image" src="" alt="">
    </div>
  </div>
  <div class="exhibition-viewer" id="exhibition-viewer" hidden role="dialog" aria-modal="true" aria-labelledby="exhibition-viewer-title">
    <div class="exhibition-viewer-backdrop" data-close-exhibition-viewer></div>
    <div class="exhibition-viewer-dialog">
      <div class="exhibition-viewer-heading"><h2 id="exhibition-viewer-title"></h2><button id="exhibition-viewer-close" type="button" aria-label="关闭作品预览">×</button></div>
      <div class="exhibition-viewer-stage"><img id="exhibition-viewer-image" alt=""></div>
      <p class="exhibition-viewer-credit" id="exhibition-viewer-credit" hidden></p>
      <div class="exhibition-viewer-index" id="exhibition-viewer-index" hidden><p>作品一览</p><div class="exhibition-viewer-thumbs" id="exhibition-viewer-thumbs" aria-label="选择作品"></div></div>
    </div>
  </div>
  <script src="../../aurora.js?v=draw-history-1"></script>
  <script src="../draw.js?v=1"></script>
  <script src="../../huddle.js?v=1-1"></script>
</body>
</html>
