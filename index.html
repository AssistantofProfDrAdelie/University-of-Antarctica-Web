<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>南极大学 · Antarctic University</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=phase-2-2">
  <link rel="stylesheet" href="directory-batches.css?v=phase-2-2">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <button class="crest-trigger" id="crest-trigger" type="button" aria-label="查看南极大学校徽">
        <img src="南极大学校徽.jpg" alt="南极大学校徽">
      </button>
      <a class="brand-name" href="#directory" aria-label="南极大学首页"><strong>南极大学</strong><small>THE UNIVERSITY OF ANTARCTICA</small></a>
    </div>
    <nav aria-label="主导航"><a href="#directory">学生名录</a></nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">PUBLIC RECORD · 2025—</p>
      <h1 id="hero-title">学生名录<br><em>Student Directory</em></h1>
      <p class="intro">Student Directory · Admission Archive</p>
    </section>

    <section id="directory" class="section" aria-labelledby="directory-title">
      <div class="section-heading"><div><p class="eyebrow">REGISTERED STUDENTS</p><h2 id="directory-title">学生名录</h2></div><span id="student-count" class="count"></span></div>
      <div class="directory-search">
        <label for="directory-search-input">检索学生名录</label>
        <input id="directory-search-input" type="search" placeholder="搜索学生姓名或专业" autocomplete="off" spellcheck="false">
      </div>
      <nav id="directory-index" class="directory-index" aria-label="年份与录取批次索引"></nav>
      <div id="student-grid" class="student-grid" aria-live="polite"></div>
    </section>
  </main>
  <section class="motto-section" aria-label="南极大学校训">
    <img src="南极大学校训.png" alt="From the Ice, For the Earth · 南极大学校训">
  </section>
  <footer>南极大学 · Antarctic University <span>Student Directory prototype</span></footer>
  <div class="crest-modal" id="crest-modal" hidden role="dialog" aria-modal="true" aria-labelledby="crest-modal-title">
    <div class="crest-backdrop" data-close-crest></div>
    <div class="crest-dialog">
      <h2 id="crest-modal-title" class="visually-hidden">南极大学校徽</h2>
      <button class="crest-close" id="crest-close" type="button" aria-label="关闭校徽预览">×</button>
      <img src="南极大学校徽.jpg" alt="南极大学校徽放大图">
    </div>
  </div>
  <script src="app.js?v=phase-2-2"></script>
</body>
</html>
