<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>南极大学 · The University of Antarctica</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=phase-2-8">
  <link rel="stylesheet" href="directory-batches.css?v=phase-2-2">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a class="brand-logo-trigger identity-image-trigger" href="南极大学校徽2.png" data-lightbox="identity" data-lightbox-alt="the University of Antarctica 标准校标" aria-label="查看 the University of Antarctica 标准校标">
        <img src="南极大学校徽2.png" alt="the University of Antarctica 标准校标">
      </a>
      <div class="brand-name" aria-label="南极大学"><strong>南极大学</strong></div>
    </div>
    <nav aria-label="机构导航与主导航">
      <a class="directory-nav-link" href="aurora/">极光艺术馆</a>
      <a class="institutional-node" href="阿德利教授小红书.jpg" data-lightbox="identity" data-lightbox-alt="阿德利教授, Ph.D. 小红书账户卡" aria-label="查看阿德利教授, Ph.D. 身份卡">
        <span class="identity-portrait"><img src="阿德利教授.JPG" alt="阿德利教授, Ph.D. 头像"></span>
        <span class="identity-copy"><strong>阿德利教授, Ph.D.</strong><small>小红书</small></span>
      </a>
      <a class="institutional-node" href="一袋企鹅二维码.jpg" data-lightbox="identity" data-lightbox-alt="一袋企鹅微信公众号二维码" aria-label="查看一袋企鹅微信公众号二维码">
        <span class="identity-qr"><img src="一袋企鹅二维码.jpg" alt="一袋企鹅微信公众号二维码"></span>
        <span class="identity-copy"><strong>一袋企鹅</strong><small>微信公众号</small></span>
      </a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">学生名录<br><em>Student Directory</em></h1>
        <p class="intro">The Student Directory of the University of Antarctica · Admission Archive</p>
      </div>
      <a class="hero-shield identity-image-trigger" href="南极大学校徽.jpg" data-lightbox="identity" data-lightbox-alt="the University of Antarctica ceremonial shield" aria-label="查看 the University of Antarctica ceremonial shield">
        <span class="hero-shield-field"><img src="南极大学校徽.jpg" alt="the University of Antarctica ceremonial shield"></span>
      </a>
    </section>

    <section id="directory" class="section" aria-labelledby="directory-title">
      <div class="section-heading"><div><p class="eyebrow">REGISTERED STUDENTS</p><h2 id="directory-title">学生名录</h2></div><span id="student-count" class="count"></span></div>
      <div class="directory-search">
        <label for="directory-search-input">检索学生名录</label>
        <input id="directory-search-input" type="search" placeholder="搜索学生姓名或专业" autocomplete="off" spellcheck="false">
      </div>
      <nav id="directory-index" class="directory-index" aria-label="年份与录取批次索引"></nav>
      <div id="student-grid" class="student-grid" aria-live="polite"></div>
    </section>
  </main>
  <section class="institutional-closing" aria-label="南极大学校训">
    <img class="motto-image" src="南极大学校训.png" alt="From the Ice, For the Earth · 南极大学校训">
  </section>
  <footer>南极大学 · The University of Antarctica <span>Student Directory archive</span></footer>
  <div class="identity-lightbox" id="identity-lightbox" hidden role="dialog" aria-modal="true" aria-labelledby="identity-lightbox-title">
    <div class="identity-lightbox-backdrop" data-close-lightbox></div>
    <div class="identity-lightbox-dialog">
      <h2 id="identity-lightbox-title" class="visually-hidden">the University of Antarctica identity asset</h2>
      <button class="identity-lightbox-close" id="identity-lightbox-close" type="button" aria-label="关闭身份资产预览">×</button>
      <img id="identity-lightbox-image" src="" alt="">
    </div>
  </div>
  <script src="app.js?v=phase-2-6"></script>
</body>
</html>
