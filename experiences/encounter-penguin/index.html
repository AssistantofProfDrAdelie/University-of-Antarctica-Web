<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:,">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f7f9" />
    <title>Encounter a Penguin</title>
    <link rel="stylesheet" href="styles.css?v=visitor-count-1" />
  </head>
  <body>
    <main>
      <header class="masthead">
        <a class="brand" href="./" aria-label="Encounter a Penguin home">
          <img class="brand-mark" src="assets/prof-adelie-icon.png" alt="" aria-hidden="true" />
          <span>Encounter a Penguin</span>
        </a>
        <nav class="institutional-links" aria-label="南极大学机构导航">
          <a class="university-link" href="../../" aria-label="返回南极大学">
            <img src="../../南极大学校徽2.png" alt="南极大学 · The University of Antarctica" />
          </a>
          <a class="channel-link" href="../../阿德利教授小红书.jpg" data-lightbox="identity" data-lightbox-alt="阿德利教授, Ph.D. 小红书账户卡" aria-label="查看阿德利教授小红书">
            <span class="channel-image channel-portrait"><img src="../../阿德利教授.JPG" alt="" /></span>
            <span class="channel-copy"><strong>阿德利教授, Ph.D.</strong><small>小红书</small></span>
          </a>
          <a class="channel-link" href="../../一袋企鹅二维码.jpg" data-lightbox="identity" data-lightbox-alt="一袋企鹅微信公众号二维码" aria-label="查看一袋企鹅微信公众号二维码">
            <span class="channel-image channel-qr"><img src="../../一袋企鹅二维码.jpg" alt="" /></span>
            <span class="channel-copy"><strong>一袋企鹅</strong><small>微信公众号</small></span>
          </a>
        </nav>
      </header>

      <section class="intro" id="intro">
        <div class="intro-copy">
          <h1>Professor Adelie is nearby.</h1>
        </div>
        <label class="drop-zone" id="dropZone">
          <input id="fileInput" type="file" accept="image/*" />
          <span class="upload-icon" aria-hidden="true">↥</span>
          <strong>Choose a photograph</strong>
          <span>or drop one here</span>
        </label>
      </section>

      <section class="encounter" id="encounter" hidden>
        <div class="photo-column">
          <div class="photo-head">
            <button class="text-button" id="changeButton" type="button">Choose another</button>
          </div>
          <div class="photo-frame" id="photoFrame">
            <canvas id="sourceCanvas" aria-label="Uploaded photograph"></canvas>
            <canvas id="visitorCanvas" aria-hidden="true"></canvas>
            <a class="save-button" id="saveButton" href="#" download hidden>Save <span aria-hidden="true">↓</span></a>
          </div>
        </div>
      </section>
    </main>
    <aside class="penguin-count" aria-label="Encounter Penguin 页面累计浏览数">
      <img
        src="https://hits.sh/assistantofprofdradelie.github.io/University-of-Antarctica-Web/experiences/encounter-penguin.svg?label=%E4%BC%81%E9%B9%85&color=087985&labelColor=123b59"
        alt="企鹅浏览数"
        width="82"
        height="20"
        referrerpolicy="no-referrer"
      />
    </aside>
    <div class="identity-lightbox" id="identityLightbox" hidden role="dialog" aria-modal="true" aria-labelledby="identityLightboxTitle">
      <button class="identity-lightbox-backdrop" type="button" data-close-lightbox aria-label="关闭预览"></button>
      <div class="identity-lightbox-dialog">
        <h2 class="visually-hidden" id="identityLightboxTitle">社交账号预览</h2>
        <button class="identity-lightbox-close" id="identityLightboxClose" type="button" aria-label="关闭预览">×</button>
        <img id="identityLightboxImage" src="" alt="" />
      </div>
    </div>
    <script src="app-ui.js?v=visitor-count-1"></script>
  </body>
</html>
