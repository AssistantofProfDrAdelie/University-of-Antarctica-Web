<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" href="data:,">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1e8" />
    <title>遇见企鹅 · 校园活动 · 南极大学</title>
    <link rel="stylesheet" href="styles.css?v=campus-4" />
  </head>
  <body>
    <header class="campus-header">
      <a class="campus-brand" href="../../"><img src="assets/南极大学校徽2.png" alt="南极大学"><span>南极大学</span></a>
      <nav aria-label="主导航"><a href="../../">学生名录</a><a href="../../alumni/">校友风采</a><a href="../../aurora/">极光艺术馆</a><a href="../../campus/" aria-current="page">校园活动</a></nav>
      <div class="channel-links" aria-label="阿德利教授与一袋企鹅社交账号">
        <a class="channel-link" href="assets/阿德利教授小红书.jpg" data-lightbox="identity" data-lightbox-alt="阿德利教授, Ph.D. 小红书账户卡" aria-label="查看阿德利教授小红书">
            <span class="channel-image channel-portrait"><img src="assets/professor-adelie-owner-approved.png" alt="" /></span>
            <span class="channel-copy"><strong>阿德利教授</strong><small>小红书</small></span>
        </a>
        <a class="channel-link" href="assets/一袋企鹅二维码.jpg" data-lightbox="identity" data-lightbox-alt="一袋企鹅微信公众号二维码" aria-label="查看一袋企鹅微信公众号二维码">
            <span class="channel-image channel-qr"><img src="assets/一袋企鹅二维码.jpg" alt="" /></span>
            <span class="channel-copy"><strong>一袋企鹅</strong><small>微信公众号</small></span>
        </a>
      </div>
    </header>
    <nav class="campus-subnav" aria-label="校园活动项目">
      <div class="campus-subnav-track">
        <a href="../../campus/">与鹅同行</a>
        <a href="./" aria-current="page">遇见企鹅</a>
        <a href="http://penguins.frozenfrog.top/" target="_blank" rel="noopener noreferrer" aria-label="企鹅测试（外部网站，在新标签页打开）">企鹅测试<span class="external-link-indicator" aria-hidden="true">外部网站 ↗</span></a>
      </div>
    </nav>
    <main>
      <div class="experience-heading">
        <a class="brand" href="./" aria-label="Encounter a Penguin home">
          <img class="brand-mark" src="assets/prof-adelie-icon.png" alt="" aria-hidden="true" />
          <span>Encounter a Penguin</span>
        </a>
      </div>

      <section class="intro" id="intro">
        <div class="intro-copy">
          <p class="eyebrow">校园活动 / 遇见企鹅</p>
          <h1>Professor Adelie is nearby.</h1>
        </div>
        <label class="drop-zone" id="dropZone">
          <input id="fileInput" type="file" accept="image/*" />
          <span class="upload-icon" aria-hidden="true">↥</span>
          <strong>Choose a photograph</strong>
          <span>or drop one here</span>
        </label>
      </section>

      <section class="encounter" id="encounter" hidden>
        <div class="photo-column">
          <div class="photo-head">
            <button class="text-button" id="changeButton" type="button">Choose another</button>
          </div>
          <div class="photo-frame" id="photoFrame">
            <canvas id="sourceCanvas" aria-label="Uploaded photograph"></canvas>
            <canvas id="visitorCanvas" aria-hidden="true"></canvas>
            <a class="save-button" id="saveButton" href="#" download hidden>Save <span aria-hidden="true">↓</span></a>
          </div>
        </div>
      </section>
    </main>
    <div class="identity-lightbox" id="identityLightbox" hidden role="dialog" aria-modal="true" aria-labelledby="identityLightboxTitle">
      <button class="identity-lightbox-backdrop" type="button" data-close-lightbox aria-label="关闭预览"></button>
      <div class="identity-lightbox-dialog">
        <h2 class="visually-hidden" id="identityLightboxTitle">社交账号预览</h2>
        <button class="identity-lightbox-close" id="identityLightboxClose" type="button" aria-label="关闭预览">×</button>
        <img id="identityLightboxImage" src="" alt="" />
      </div>
    </div>
    <script src="app-ui.js?v=campus-1"></script>
  </body>
</html>
