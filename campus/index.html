<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>校园活动 · 与鹅同行 · 南极大学</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="campus.css?v=1-2">
</head>
<body>
  <header class="campus-header">
    <a class="campus-brand" href="../"><img src="../南极大学校徽2.png" alt="南极大学"><span>南极大学</span></a>
    <nav aria-label="主导航"><a href="../">学生名录</a><a href="../alumni/">校友风采</a><a href="../aurora/">极光艺术馆</a><a href="./" aria-current="page">校园活动</a></nav>
  </header>
  <nav class="campus-subnav" aria-label="校园活动项目">
    <ul class="campus-subnav-track">
      <li><a href="./" aria-current="page">与鹅同行</a></li>
    </ul>
  </nav>
  <main class="campus-main">
    <section class="campus-intro" aria-labelledby="page-title">
      <div><p class="eyebrow">校园活动</p><h1 id="page-title">与鹅同行</h1><a class="browse-link" href="#albums">浏览相册 <span aria-hidden="true">↓</span></a></div>
      <figure id="hero-photo" class="hero-photo" aria-label="与鹅同行精选照片轮播"><div class="photo-placeholder">正在加载照片…</div></figure>
    </section>
    <section id="albums" class="albums-section" aria-labelledby="albums-title">
      <div class="albums-heading"><h2 id="albums-title">活动相册</h2><p id="album-count" class="album-count" aria-live="polite"></p></div>
      <div class="album-toolbar"><div class="year-filters" role="group" aria-label="按年份筛选"><button data-year="all" aria-pressed="true">全部</button><button data-year="2025" aria-pressed="false">2025</button><button data-year="2026" aria-pressed="false">2026</button></div><label class="sort-label">时间顺序 <select id="sort"><option value="asc">从最早开始</option><option value="desc">从最近开始</option></select></label></div>
      <p id="load-error" role="alert" hidden>相册暂时未能加载，请刷新页面重试。</p>
      <div id="album-grid" class="album-grid"></div>
      <section id="separate-albums"><h3>其他相册</h3><div id="separate-grid" class="album-grid"></div></section>
      <noscript><p>请启用 JavaScript 来浏览活动相册。</p></noscript>
    </section>
    <section id="album-detail" class="album-detail" hidden aria-labelledby="detail-title"><button id="back-albums" class="text-button">← 返回活动相册</button><div class="detail-heading"><div><p id="detail-meta" class="eyebrow"></p><h2 id="detail-title" tabindex="-1"></h2><p id="detail-location"></p></div><span id="detail-count"></span></div><div id="photo-grid" class="photo-grid"></div></section>
  </main>
  <section class="institutional-closing" aria-label="南极大学校训">
    <img class="motto-image" src="../南极大学校训.png" alt="From the Ice, For the Earth · 南极大学校训">
  </section>
  <footer>南极大学 · The University of Antarctica</footer>
  <dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-bar"><div><h2 id="viewer-title"></h2><span id="viewer-count" aria-live="polite"></span></div><button id="close-viewer" aria-label="关闭大图">×</button></div><div class="viewer-stage"><button id="previous-photo" aria-label="上一张">←</button><img id="viewer-image" alt=""><button id="next-photo" aria-label="下一张">→</button></div><p class="viewer-hint">使用左右方向键翻页 · Esc 关闭</p></dialog>
  <script src="campus.js?v=20260922-4"></script>
</body>
</html>
